<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财经文档系统 - 档案业务管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1173d4",
                        "bg-page": "#f4f6f8",
                        "line": "#dbe2ea"
                    },
                    fontFamily: {
                        display: ["Microsoft YaHei", "微软雅黑", "Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style type="text/tailwindcss">
        body {
            @apply bg-bg-page text-slate-800 font-display;
        }
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <header class="h-14 bg-white border-b border-line px-6 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">folder_managed</span>
            <span class="font-semibold">财经文档系统</span>
        </div>
        <div class="text-sm text-slate-500">F08 / 档案业务管理</div>
    </header>

    <main class="max-w-[1440px] mx-auto p-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold">档案业务管理</h1>
            <p class="text-sm text-slate-500 mt-1">销毁文档流程原型导航</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <a href="./destruction_application/index.html" class="bg-white border border-line rounded-xl p-5 hover:border-primary hover:shadow-md transition-all group">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="text-sm text-slate-500 mb-2">流程节点 1</div>
                        <div class="text-lg font-semibold group-hover:text-primary">销毁申请</div>
                        <div class="text-sm text-slate-500 mt-2">文档管理员发起申请，填写基本信息、计划、监督与清单</div>
                    </div>
                    <span class="material-symbols-outlined text-slate-400 group-hover:text-primary">arrow_outward</span>
                </div>
            </a>

            <div class="bg-white border border-dashed border-line rounded-xl p-5">
                <div class="text-sm text-slate-500 mb-2">流程节点 2-8</div>
                <div class="text-lg font-semibold">后续页面占位</div>
                <div class="text-sm text-slate-500 mt-2">审核申请、业务鉴定、综合鉴定、汇总清单、销毁审批、出库审批、实施销毁</div>
            </div>
        </div>
    </main>
</body>
</html>
